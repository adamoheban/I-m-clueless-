<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB Transaction Wire</title>
<style>
  :root{--bg:#0b0f17;--panel:#131a26;--ink:#eef2f8;--muted:#8b97ab;--line:#243049;--accent:#ffd23f}
  *{box-sizing:border-box;margin:0}
  body{background:radial-gradient(1200px 500px at 50% -200px,#1b2a4a 0%,var(--bg) 60%) no-repeat,var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
  .intro{max-width:34rem;text-align:center}
  .kicker{letter-spacing:.3em;font-size:.7rem;color:var(--accent);font-weight:700;text-transform:uppercase}
  h1{font-size:clamp(2.2rem,9vw,3.6rem);font-weight:900;letter-spacing:-.02em;margin:.3rem 0 .8rem;line-height:1.05}
  h1 span{color:var(--accent)}
  p{color:var(--muted);font-size:1.05rem}
  .go{display:inline-block;margin-top:1.6rem;background:var(--accent);color:#111;font-weight:800;text-decoration:none;border-radius:12px;padding:.85rem 1.6rem;font-size:1.05rem}
  .go:hover,.go:focus-visible{filter:brightness(1.08);outline:2px solid #fff;outline-offset:2px}
  .more{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1.4rem}
  .more a{color:var(--ink);text-decoration:none;font-size:.85rem;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.35rem .8rem}
  .more a:hover{border-color:var(--accent)}
</style>
</head>
<body>
<main class="intro">
  <div class="kicker">Offseason 2026</div>
  <h1>MLB <span>Transaction</span> Wire</h1>
  <p>Signings, trades, releases and more, organized by team and updated nightly.</p>
  <a class="go" href="transactions.html">Open the transaction wire</a>
  <nav class="more" aria-label="More pages">
    <a href="top-transactions.html">Top Transactions</a>
    <a href="blockbusters.html">Blockbuster Trades</a>
    <a href="lockout.html">Lockout Watch</a>
  </nav>
</main>
</body>
</html>
